name: Build Release Client Candidate

on:
  push:
    branches:
      - "release/**"
      - "release-client/**"
  pull_request:
    paths:
      - ".github/workflows/build-release-client.yml"
      - ".github/workflows/quality.yml"
      - "requirements.client.txt"
      - "requirements.client.lock"
      - "scripts/ci/build_release_client.py"
      - "scripts/ci/verify_release_client.py"
      - "scripts/setup/bootstrap_release_bundle.py"
      - "scripts/setup/install.py"
      - "src/**"
      - "tests/test_release_client_bundle.py"
      - "tests/test_release_pipeline.py"
  workflow_dispatch:

jobs:
  macos-client-candidate:
    name: Build clean macOS client candidate
    runs-on: macos-latest
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/dashboard/ui/package-lock.json
      - name: Build dashboard assets
        working-directory: src/dashboard/ui
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
      - name: Verify client runtime lock freshness
        run: |
          mkdir "$RUNNER_TEMP/elefante-client-lock-check"
          cp requirements.client.txt "$RUNNER_TEMP/elefante-client-lock-check/requirements.client.txt"
          cp requirements.client.lock "$RUNNER_TEMP/elefante-client-lock-check/requirements.client.lock"
          (
            cd "$RUNNER_TEMP/elefante-client-lock-check"
            uv pip compile --universal --generate-hashes --python-version 3.11 requirements.client.txt -o requirements.client.lock
          )
          cmp requirements.client.lock "$RUNNER_TEMP/elefante-client-lock-check/requirements.client.lock"
      - name: Audit client runtime dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.client.lock
          require-hashes: true
          internal-be-careful-extra-flags: --disable-pip
          no-deps: true
      - name: Resolve product version
        id: release_metadata
        run: |
          version="$(python scripts/ci/build_release_client.py --print-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=dist/elefante-v${version}-rc.1-macOS.zip" >> "$GITHUB_OUTPUT"
      - name: Build and verify client candidate
        run: |
          archive="${{ steps.release_metadata.outputs.archive }}"
          python scripts/ci/build_release_client.py --platform macOS --publication-status candidate --output "$archive"
          python scripts/ci/verify_release_client.py --archive "$archive" --require-clean-source --expected-publication-status candidate --expected-platform macOS
          shasum -a 256 "$archive" > dist/SHA256SUMS
      - name: Prove a fresh macOS customer installation
        shell: bash
        run: |
          set -euo pipefail

          package_root="$RUNNER_TEMP/elefante-client-package"
          bundle_root="$package_root/elefante-installer-macOS"
          install_root="$HOME/.elefante/app/current"
          doctor_report="$RUNNER_TEMP/elefante-doctor.json"

          mkdir -p "$package_root"
          ditto -x -k "${{ steps.release_metadata.outputs.archive }}" "$package_root"
          test -x "$bundle_root/Install Elefante.command"
          test ! -e "$install_root"

          "$bundle_root/Install Elefante.command" --venv-mode fresh --verbose

          test -x "$install_root/.venv/bin/python"
          "$install_root/.venv/bin/python" \
            "$install_root/scripts/lifecycle/doctor.py" --json > "$doctor_report"
          python - "$doctor_report" "${{ steps.release_metadata.outputs.version }}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["ready"] is True, report
          assert report["customer_ready"] is True, report
          assert report["installation"]["scope"] == "customer", report
          assert report["installation"]["version"] == sys.argv[2], report
          assert report["installation"]["release_channel"] == "candidate", report
          assert report["installation"]["source_commit"] == os.environ["SOURCE_COMMIT"], report
          assert report["installation"]["source_clean"] is True, report
          assert "app_root" not in report["installation"], report
          assert "data_root" not in report["installation"], report
          assert report["host_coverage"]["uncovered"] == [], report
          PY

          "$install_root/.venv/bin/python" \
            "$install_root/scripts/lifecycle/uninstall_elefante.py" --apply
          if launchctl print "gui/$(id -u)/ai.elefante.daemon" >/dev/null 2>&1; then
            echo "Elefante daemon remained registered after uninstall" >&2
            exit 1
          fi
          python - "$HOME/.elefante/install-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              assert "runtime" not in manifest, manifest
          PY
      - name: Upload validation artifact only
        uses: actions/upload-artifact@v7
        with:
          name: elefante-v${{ steps.release_metadata.outputs.version }}-rc.1-macOS
          path: |
            ${{ steps.release_metadata.outputs.archive }}
            dist/SHA256SUMS
          retention-days: 14
