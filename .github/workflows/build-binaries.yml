name: Build One-Click Binaries

on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Dashboard UI
        working-directory: src/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Binary with PyInstaller
        run: pyinstaller elefante.spec

      - name: Zip Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist/elefante
          zip -r ../elefante-${{ runner.os }}.zip .

      - name: Zip Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/elefante/* -DestinationPath dist/elefante-Windows.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elefante-${{ runner.os }}-binary
          path: dist/elefante-${{ runner.os }}.zip
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Render release notes
        run: |
          python3 scripts/ci/render_release_notes.py "${{ github.ref_name }}" --output release-notes.md

      - name: Select releasable assets
        id: select_release_assets
        run: |
          python3 scripts/ci/select_release_assets.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          files: ${{ steps.select_release_assets.outputs.files }}
