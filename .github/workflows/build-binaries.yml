name: Build One-Click Binaries

on:
  pull_request:
    paths:
      - ".github/workflows/build-binaries.yml"
      - "scripts/ci/build_release_client.py"
      - "scripts/ci/build_windows_installer.py"
      - "scripts/ci/prepare_windows_branding.py"
      - "scripts/ci/resolve_release_publication.py"
      - "scripts/ci/verify_release_client.py"
      - "scripts/setup/**"
      - "scripts/lifecycle/**"
      - "scripts/pipeline/**"
      - "scripts/verify/**"
      - "tests/test_installer_bundle.py"
      - "tests/test_release_client_bundle.py"
      - "tests/test_release_pipeline.py"
      - "tests/test_windows_installer_workflow.py"
      - "tests/test_windows_branding.py"
      - "README.md"
      - "config.yaml"
      - "requirements.txt"
      - "requirements.lock"
      - "requirements.client.txt"
      - "requirements.client.lock"
      - "src/**"
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build Dashboard UI
        working-directory: src/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Resolve publication status
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          status="$(python scripts/ci/resolve_release_publication.py \
            --ref-type "${GITHUB_REF_TYPE}" \
            --ref-name "${GITHUB_REF_NAME}")"
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Build clean customer installer
        run: |
          python scripts/ci/build_release_client.py --platform "${{ runner.os }}" --publication-status "${{ steps.publication.outputs.status }}" --output dist/elefante-installer-${{ runner.os }}.zip
          python scripts/ci/verify_release_client.py --archive dist/elefante-installer-${{ runner.os }}.zip --require-clean-source --expected-publication-status "${{ steps.publication.outputs.status }}" --expected-platform "${{ runner.os }}"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller

      - name: Build Binary with PyInstaller
        run: pyinstaller elefante.spec

      - name: Zip Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist/elefante
          zip -r ../elefante-${{ runner.os }}.zip .

      - name: Zip Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/elefante/* -DestinationPath dist/elefante-Windows.zip

      - name: Smoke test platform archives (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ runner.os }}
        run: |
          set -euo pipefail

          installer_archive="dist/elefante-installer-${PLATFORM}.zip"
          binary_archive="dist/elefante-${PLATFORM}.zip"
          smoke_root="${RUNNER_TEMP}/elefante-${PLATFORM}-archive-smoke"
          bundle_root="${smoke_root}/installer/elefante-installer-${PLATFORM}"
          binary_root="${smoke_root}/binary"
          dry_run_root="${smoke_root}/must-not-be-created"
          checksum_file="${smoke_root}/SHA256SUMS"

          mkdir -p "${smoke_root}/installer" "$binary_root"
          if [[ "$PLATFORM" == "macOS" ]]; then
            # Match the Finder/Archive Utility extraction path used by customers.
            ditto -x -k "$installer_archive" "${smoke_root}/installer"
          else
            unzip -q "$installer_archive" -d "${smoke_root}/installer"
          fi
          unzip -q "$binary_archive" -d "$binary_root"

          test -f "${bundle_root}/installer-manifest.json"
          test -f "${bundle_root}/START HERE.txt"
          test -f "${bundle_root}/scripts/setup/bootstrap_release_bundle.py"
          test -f "${bundle_root}/payload/elefante/scripts/setup/install.py"
          test -f "${bundle_root}/payload/elefante/requirements.client.txt"
          test -f "${bundle_root}/payload/elefante/requirements.client.lock"
          test ! -e "${bundle_root}/payload/elefante/requirements.lock"
          test -x "${bundle_root}/install.sh"
          test -x "${binary_root}/elefante"

          if [[ "$PLATFORM" == "macOS" ]]; then
            test -x "${bundle_root}/Install Elefante.command"
          fi

          if [[ "$PLATFORM" == "macOS" ]]; then
            # Run the exact launcher the customer double-clicks.
            dry_run_output="$(
              "${bundle_root}/Install Elefante.command" \
                --install-root "$dry_run_root" \
                --venv-mode abort \
                --dry-run
            )"
          else
            dry_run_output="$(
              python "${bundle_root}/scripts/setup/bootstrap_release_bundle.py" \
                --bundle-root "$bundle_root" \
                --install-root "$dry_run_root" \
                --venv-mode abort \
                --dry-run
            )"
          fi
          test ! -e "$dry_run_root"
          grep -F "Bundle Root: ${bundle_root}" <<<"$dry_run_output"
          grep -F "Payload Root: ${bundle_root}/payload/elefante" <<<"$dry_run_output"
          grep -F "Install Root: ${dry_run_root}" <<<"$dry_run_output"
          grep -F "Release Profile: Client (runtime-only payload)" <<<"$dry_run_output"
          grep -F "Dry run only. No files were changed." <<<"$dry_run_output"

          python scripts/ci/generate_release_checksums.py \
            --output "$checksum_file" \
            "$binary_archive" "$installer_archive"
          python scripts/ci/generate_release_checksums.py \
            --verify "$checksum_file" \
            "$binary_archive" "$installer_archive"

      - name: Smoke test platform archives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerArchive = "dist/elefante-installer-Windows.zip"
          $binaryArchive = "dist/elefante-Windows.zip"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "elefante-Windows-archive-smoke"
          $installerRoot = Join-Path $smokeRoot "installer"
          $bundleRoot = Join-Path $installerRoot "elefante-installer-Windows"
          $binaryRoot = Join-Path $smokeRoot "binary"
          $dryRunRoot = Join-Path $smokeRoot "must-not-be-created"
          $checksumFile = Join-Path $smokeRoot "SHA256SUMS"

          New-Item -ItemType Directory -Force -Path $installerRoot, $binaryRoot | Out-Null
          Expand-Archive -LiteralPath $installerArchive -DestinationPath $installerRoot
          Expand-Archive -LiteralPath $binaryArchive -DestinationPath $binaryRoot

          @(
            (Join-Path $bundleRoot "installer-manifest.json"),
            (Join-Path $bundleRoot "START HERE.txt"),
            (Join-Path $bundleRoot "Install Elefante.bat"),
            (Join-Path $bundleRoot "scripts/setup/bootstrap_release_bundle.py"),
            (Join-Path $bundleRoot "payload/elefante/scripts/setup/install.py"),
            (Join-Path $bundleRoot "payload/elefante/requirements.client.txt"),
            (Join-Path $bundleRoot "payload/elefante/requirements.client.lock"),
            (Join-Path $binaryRoot "elefante.exe")
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Archive smoke test missing required file: $_"
            }
          }

          $launcherPath = Join-Path $bundleRoot "Install Elefante.bat"
          $launcherBytes = [System.IO.File]::ReadAllBytes($launcherPath)
          $invalidControlBytes = @($launcherBytes | Where-Object {
            $_ -lt 32 -and $_ -notin @(9, 10, 13)
          })
          if ($invalidControlBytes.Count -ne 0) {
            throw "Windows launcher contains invalid control bytes"
          }
          for ($index = 0; $index -lt $launcherBytes.Length; $index++) {
            if ($launcherBytes[$index] -eq 10 -and (
              $index -eq 0 -or $launcherBytes[$index - 1] -ne 13
            )) {
              throw "Windows launcher contains a bare LF instead of CRLF"
            }
          }
          $launcherText = [System.Text.Encoding]::UTF8.GetString($launcherBytes)
          if (-not $launcherText.Contains("scripts\setup\bootstrap_release_bundle.py")) {
            throw "Windows launcher does not target the bundled bootstrap path"
          }

          $dryRunOutput = & python `
            (Join-Path $bundleRoot "scripts/setup/bootstrap_release_bundle.py") `
            --bundle-root $bundleRoot `
            --install-root $dryRunRoot `
            --venv-mode abort `
            --dry-run | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Installer bundle dry-run failed"
          }
          if (Test-Path -LiteralPath $dryRunRoot) {
            throw "Installer bundle dry-run mutated the install path"
          }
          if (Test-Path -LiteralPath (Join-Path $bundleRoot "payload/elefante/requirements.lock")) {
            throw "Developer dependency lock leaked into customer installer"
          }
          @(
            "Bundle Root: $bundleRoot",
            "Payload Root: $(Join-Path $bundleRoot 'payload/elefante')",
            "Install Root: $dryRunRoot",
            "Release Profile: Client (runtime-only payload)",
            "Dry run only. No files were changed."
          ) | ForEach-Object {
            if (-not $dryRunOutput.Contains($_)) {
              throw "Installer bundle dry-run output missing: $_"
            }
          }

          python scripts/ci/generate_release_checksums.py `
            --output $checksumFile `
            $binaryArchive $installerArchive
          if ($LASTEXITCODE -ne 0) {
            throw "Checksum generation failed"
          }
          python scripts/ci/generate_release_checksums.py `
            --verify $checksumFile `
            $binaryArchive $installerArchive
          if ($LASTEXITCODE -ne 0) {
            throw "Checksum verification failed"
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: elefante-${{ runner.os }}-binary
          path: dist/elefante-${{ runner.os }}.zip
          retention-days: 5

      - name: Prepare branded Windows resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = python -c "from src import __version__; print(__version__)"
          python scripts/ci/prepare_windows_branding.py `
            --source-png assets/icons/Elefante-installer-icon.svg.png `
            --output-dir dist/windows-branding `
            --version $version

      - name: Build branded Windows EXE validation artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/ci/build_windows_installer.py `
            --payload dist/elefante-installer-Windows.zip `
            --icon dist/windows-branding/Elefante.ico `
            --version-file dist/windows-branding/Elefante.version.txt `
            --output dist/Elefante-Installer-local.exe `
            --publication-status local

      - name: Upload unsigned Windows EXE validation artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: elefante-Windows-installer-exe-validation
          path: dist/Elefante-Installer-local.exe
          retention-days: 5

      - name: Build and Authenticode-sign release Windows EXE
        id: sign_windows
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          ELEFANTE_WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:ELEFANTE_WINDOWS_SIGNING_PASSWORD)) {
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Output "Windows signing credentials unavailable; skipping signed EXE publication."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "elefante-signing.pfx"
          try {
            [System.IO.File]::WriteAllBytes(
              $certificate,
              [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            )
            $env:ELEFANTE_WINDOWS_SIGNING_CERTIFICATE_PATH = $certificate
            python scripts/ci/build_windows_installer.py `
              --payload dist/elefante-installer-Windows.zip `
              --icon dist/windows-branding/Elefante.ico `
              --version-file dist/windows-branding/Elefante.version.txt `
              --output dist/Elefante-Installer.exe `
              --publication-status "${{ steps.publication.outputs.status }}" `
              --sign
            if ($LASTEXITCODE -ne 0) {
              throw "Signed Windows installer build failed"
            }
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
            Remove-Item Env:ELEFANTE_WINDOWS_SIGNING_CERTIFICATE_PATH -ErrorAction SilentlyContinue
          }

      - name: Upload signed Windows EXE
        if: runner.os == 'Windows' && steps.sign_windows.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: elefante-Windows-installer-exe
          path: dist/Elefante-Installer.exe
          retention-days: 5

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          python scripts/ci/build_dmg.py --bundle dist/elefante-installer-macOS.zip --output dist/Elefante-Installer.dmg

      - name: Sign and Notarize DMG
        id: sign_notarize
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_DEVELOPER_ID:-}" || -z "${APPLE_TEAM_ID:-}" || -z "${APPLE_ID:-}" || -z "${APPLE_APP_PASSWORD:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing credentials unavailable; skipping signed DMG publication."
            exit 0
          fi
          # Sign
          codesign -s "$APPLE_DEVELOPER_ID" --timestamp dist/Elefante-Installer.dmg
          # Notarize
          xcrun notarytool submit dist/Elefante-Installer.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          # Staple the notarization ticket
          xcrun stapler staple dist/Elefante-Installer.dmg
          # Verify
          spctl --assess --type open --context context:primary-signature -v dist/Elefante-Installer.dmg
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Installer Bundle
        uses: actions/upload-artifact@v7
        with:
          name: elefante-${{ runner.os }}-installer
          path: dist/elefante-installer-${{ runner.os }}.zip
          retention-days: 5

      - name: Upload DMG (only if signed)
        if: runner.os == 'macOS' && steps.sign_notarize.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: elefante-macOS-installer-dmg
          path: dist/Elefante-Installer.dmg
          retention-days: 5

  dependency-audit:
    name: Release Dependency Audit
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # A tag can never publish while the locked production dependencies have
      # a known advisory. Pull requests run the same production audit so the
      # release candidate receives evidence before a tag exists.
      - name: Audit hash-locked Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.client.lock
          require-hashes: true
          internal-be-careful-extra-flags: --disable-pip
          no-deps: true

  release:
    name: Create GitHub Release
    needs: [build, dependency-audit]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download releasable installer artifacts
        uses: actions/download-artifact@v8
        with:
          # Binary archives are retained for CI diagnostics, not published.
          # Avoid downloading them into the release job.
          pattern: elefante-*-installer*
          path: artifacts
          merge-multiple: false

      - name: Render release notes
        run: |
          python3 scripts/ci/render_release_notes.py "${{ github.ref_name }}" --output release-notes.md

      - name: Select releasable assets
        id: select_release_assets
        run: |
          python3 scripts/ci/select_release_assets.py

      - name: Generate and verify SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_files <<'FILES'
          ${{ steps.select_release_assets.outputs.files }}
          FILES
          python3 scripts/ci/generate_release_checksums.py \
            --output SHA256SUMS \
            "${release_files[@]}"
          python3 scripts/ci/generate_release_checksums.py \
            --verify SHA256SUMS \
            "${release_files[@]}"

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v7
        with:
          name: elefante-${{ github.ref_name }}-checksums
          path: SHA256SUMS
          retention-days: 5

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          files: |
            ${{ steps.select_release_assets.outputs.files }}
            SHA256SUMS
