name: Build One-Click Binaries

on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Dashboard UI
        working-directory: src/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Build Installer Bundle
        run: |
          python scripts/ci/build_installer_bundle.py --platform "${{ runner.os }}" --output dist/elefante-installer-${{ runner.os }}.zip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller

      - name: Build Binary with PyInstaller
        run: pyinstaller elefante.spec

      - name: Zip Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist/elefante
          zip -r ../elefante-${{ runner.os }}.zip .

      - name: Zip Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/elefante/* -DestinationPath dist/elefante-Windows.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elefante-${{ runner.os }}-binary
          path: dist/elefante-${{ runner.os }}.zip
          retention-days: 5

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          python scripts/ci/build_dmg.py --bundle dist/elefante-installer-macOS.zip --output dist/Elefante-Installer.dmg

      - name: Sign and Notarize DMG
        if: runner.os == 'macOS' && env.APPLE_DEVELOPER_ID != ''
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Sign
          codesign -s "$APPLE_DEVELOPER_ID" --timestamp dist/Elefante-Installer.dmg
          # Notarize
          xcrun notarytool submit dist/Elefante-Installer.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          # Staple the notarization ticket
          xcrun stapler staple dist/Elefante-Installer.dmg
          # Verify
          spctl --assess --type open --context context:primary-signature -v dist/Elefante-Installer.dmg

      - name: Upload Installer Bundle
        uses: actions/upload-artifact@v4
        with:
          name: elefante-${{ runner.os }}-installer
          path: dist/elefante-installer-${{ runner.os }}.zip
          retention-days: 5

      - name: Upload DMG (only if signed)
        if: runner.os == 'macOS' && env.APPLE_DEVELOPER_ID != ''
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        uses: actions/upload-artifact@v4
        with:
          name: elefante-macOS-dmg
          path: dist/Elefante-Installer.dmg
          retention-days: 5

  dependency-audit:
    name: Release Dependency Audit
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # A tag can never publish while the locked production dependencies have
      # a known advisory. This is intentionally separate from pull-request
      # quality checks so remediation work can continue while GAP-029 remains
      # an honest release blocker.
      - name: Audit hash-locked Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock
          require-hashes: true
          disable-pip: true
          no-deps: true

  release:
    name: Create GitHub Release
    needs: [build, dependency-audit]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Render release notes
        run: |
          python3 scripts/ci/render_release_notes.py "${{ github.ref_name }}" --output release-notes.md

      - name: Select releasable assets
        id: select_release_assets
        run: |
          python3 scripts/ci/select_release_assets.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          files: ${{ steps.select_release_assets.outputs.files }}
