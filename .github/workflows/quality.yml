name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Task Intelligence fixtures verify exact historical base/fix commits.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify universal Python lock freshness
        run: |
          mkdir "$RUNNER_TEMP/elefante-lock-check"
          cp requirements.txt "$RUNNER_TEMP/elefante-lock-check/requirements.txt"
          cp requirements.lock "$RUNNER_TEMP/elefante-lock-check/requirements.lock"
          (
            cd "$RUNNER_TEMP/elefante-lock-check"
            uv pip compile --universal --generate-hashes --python-version 3.11 requirements.txt -o requirements.lock
          )
          cmp requirements.lock "$RUNNER_TEMP/elefante-lock-check/requirements.lock"
      - name: Verify client runtime lock freshness
        run: |
          mkdir "$RUNNER_TEMP/elefante-client-lock-check"
          cp requirements.client.txt "$RUNNER_TEMP/elefante-client-lock-check/requirements.client.txt"
          cp requirements.client.lock "$RUNNER_TEMP/elefante-client-lock-check/requirements.client.lock"
          (
            cd "$RUNNER_TEMP/elefante-client-lock-check"
            uv pip compile --universal --generate-hashes --python-version 3.11 requirements.client.txt -o requirements.client.lock
          )
          cmp requirements.client.lock "$RUNNER_TEMP/elefante-client-lock-check/requirements.client.lock"
      - run: python -m pytest tests -q
      - run: python -m pytest tests -m slow -q
      - name: Verify release contracts
        run: |
          python scripts/ci/bump_version.py --check
          version="$(python -c 'from src import __version__; print(__version__)')"
          python scripts/ci/render_release_notes.py "$version" --validate-only
          python scripts/ci/verify_task_intelligence_benchmark.py --verify-canaries
          python -m ruff check \
            scripts/ci/audit_task_intelligence_retrieval.py \
            scripts/ci/generate_release_checksums.py \
            scripts/ci/run_task_intelligence_baseline.py \
            scripts/ci/run_task_intelligence_evaluation.py \
            scripts/ci/resolve_release_publication.py \
            scripts/ci/summarize_task_intelligence_evaluation.py \
            scripts/ci/verify_task_intelligence_benchmark.py \
            scripts/demo/generate_showcase_snapshot.py \
            scripts/setup/host_selection.py \
            scripts/setup/init_databases.py \
            src/core/governance.py \
            src/core/task_intelligence.py \
            src/core/task_intelligence_ledger.py \
            src/modules/distiller/privacy.py \
            tests/test_task_intelligence.py \
            tests/test_task_intelligence_baseline.py \
            tests/test_task_intelligence_benchmark.py \
            tests/test_task_intelligence_evaluation.py \
            tests/test_task_intelligence_ledger.py \
            tests/test_task_intelligence_report.py
          git diff --check

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/dashboard/ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Build and verify the clean macOS client candidate
        working-directory: .
        run: |
          python scripts/ci/build_release_client.py --platform macOS --publication-status candidate --output "$RUNNER_TEMP/elefante-v2.12.2-rc.1-macOS.zip"
          python scripts/ci/verify_release_client.py --archive "$RUNNER_TEMP/elefante-v2.12.2-rc.1-macOS.zip" --require-clean-source --expected-publication-status candidate --expected-platform macOS

  dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit hash-locked Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock
          require-hashes: true
          internal-be-careful-extra-flags: --disable-pip
          no-deps: true
      - name: Audit client runtime dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.client.lock
          require-hashes: true
          internal-be-careful-extra-flags: --disable-pip
          no-deps: true
