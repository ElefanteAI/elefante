# Elefante — IDE / Agent Integration Matrix
#
# Single source of truth for released, preview, community, and planned host surfaces.
# Used by:
#   - agents/installer.md (which surfaces to detect-then-emit)
#   - agents/integration-inspector.md (manual doc-drift audit)
#   - docs/how-to/configure-ide.md (per-surface install reference)
#   - tests/test_developer_routing.py (drift guards)
#
# Schema source: workspace/proposals/ide-integration-surface.md §7.2
# Status field semantics:
#   configured    — file present and active in this repo (or installer writes it at install time)
#   compatible    — emitted against the documented host contract and covered by Elefante's adapter tests; not yet host-certified end-to-end
#   partial       — installer output exists, but adapter or host-lifecycle proof is incomplete; shown as Preview
#   community     — documented manual path; no Elefante-owned host lifecycle adapter yet
#   planned       — surface exists per matrix but Elefante has not yet implemented integration
#   deprecated    — was supported, now retired (kept for migration window)
#
# Verification is per row. A date proves only the cited contract review; it is
# not host certification. `verified_doc_hash: pending` means no automated
# vendor-document drift proof has been recorded.
# `installer_writes` is always boolean. Write ownership belongs in
# `documentation.install_authority`, not in that boolean field.

schema_version: 1

surfaces:
  # ───────── Currently configured in this repo ─────────

  - id: vscode-copilot
    kind: ide-extension
    in_repo:
      - path: .github/copilot-instructions.md
        purpose: End-user agent constitution (Four Laws, cardinal sins, tool table, commands)
        status: configured
        installer_writes: false
      - path: .github/workflows/build-binaries.yml
        purpose: CI workflow for binary releases
        status: configured
        installer_writes: false
    user_home:
      - path: ~/Library/Application Support/Code/User/mcp.json
        platform: macos
        purpose: VS Code MCP server registration
        installer_writes: true
      - path: '%APPDATA%\Code\User\mcp.json'
        platform: windows
        purpose: VS Code MCP server registration
        installer_writes: true
      - path: ~/.config/Code/User/mcp.json
        platform: linux
        purpose: VS Code MCP server registration
        installer_writes: true
    skill_paths:
      project:
        - .github/skills/
        - .claude/skills/
        - .agents/skills/
      global:
        - ~/.copilot/skills/
        - ~/.claude/skills/
        - ~/.agents/skills/
      format: anthropic-skill-v1
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_vscode_bob.py
    doc_urls:
      - https://docs.github.com/en/copilot/customizing-copilot/about-customizing-github-copilot-chat-responses
      - https://code.visualstudio.com/docs/copilot/copilot-chat
    last_verified: 2026-04-18
    verified_doc_hash: pending  # Refreshed by integration-inspector before a release cut
    status: compatible

  - id: claude-code
    kind: cli-agent
    in_repo:
      - path: .claude/skills/
        purpose: Anthropic Skill v1 SKILL.md files
        status: planned
        installer_writes: false
    user_home:
      - path: ~/.claude.json
        purpose: Claude Code MCP server registration
        installer_writes: true
    skill_paths:
      project:
        - .claude/skills/{name}/SKILL.md
      global:
        - ~/.claude/skills/{name}/SKILL.md
      format: anthropic-skill-v1
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_cli_agents.py
    doc_urls:
      - https://code.claude.com/docs/skills
      - https://code.claude.com/docs/en/mcp
    last_verified: 2026-07-22
    verified_doc_hash: pending
    status: compatible
    notes: |
      The native Claude CLI writes and removes the user-scoped MCP registration;
      Elefante records a fingerprint of `claude mcp get elefante` before it may
      unregister it. Existing user registrations are preserved.
      Full Skill v1 surface (.claude/skills/) is tracked in
      workspace/proposals/ide-integration-surface.md as Upcoming.

  # ───────── Local (gitignored) installer-emitted files ─────────

  - id: cursor
    kind: ide
    in_repo:
      - path: .cursorrules
        purpose: Retired Cursor instruction format; retained only as design history
        status: deprecated
        installer_writes: false
        notes: |
          The released installer configures MCP only. It does not write this
          legacy file. Any future instruction surface must use the current
          vendor contract and pass a fresh review.
      - path: .cursor/rules/*.mdc
        purpose: Cursor rules (new format)
        status: planned
        installer_writes: false
    user_home:
      - path: ~/.cursor/mcp.json
        purpose: Cursor MCP server registration
        installer_writes: true
    skill_paths:
      project:
        - .cursor/rules/*.mdc
      global:
        - (UI-only; user rules entered via Cursor settings)
      format: cursor-rules-mdc
      frontmatter:
        - description
        - globs
        - alwaysApply
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_cursor_kiro.py
    doc_urls:
      - https://docs.cursor.com/context/rules
      - https://docs.cursor.com/context/model-context-protocol
    last_verified: 2026-07-22
    verified_doc_hash: pending
    status: compatible

  - id: windsurf
    kind: ide
    in_repo:
      - path: .windsurfrules
        purpose: Windsurf auto-load instructions
        status: planned
        installer_writes: false
      - path: .windsurf/rules/*.md
        purpose: Windsurf rules (frontmatter format)
        status: planned
        installer_writes: false
    user_home:
      - path: ~/.codeium/windsurf/memories/global_rules.md
        purpose: Global Windsurf memories
        installer_writes: false
    skill_paths:
      project:
        - .windsurf/rules/*.md
      global:
        - ~/.codeium/windsurf/memories/global_rules.md
      format: windsurf-rules-frontmatter
      frontmatter:
        - trigger
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: planned
    last_verified: 2026-04-18
    verified_doc_hash: pending
    status: planned

  # ───────── Planned integrations ─────────

  - id: bob
    kind: ide
    in_repo: []
    user_home:
      - path: ~/.bob/settings/mcp_settings.json
        purpose: IBM Bob MCP server registration (canonical path)
        installer_writes: true
    skill_paths:
      project:
        - .bob/skills/{name}/SKILL.md
      global:
        - ~/.bob/skills/{name}/SKILL.md
      format: anthropic-skill-v1
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_vscode_bob.py  # also handles Bob detection
    last_verified: 2026-04-18
    verified_doc_hash: pending
    status: partial
    notes: |
      The installer detects Bob and writes the tested user-global MCP entry.
      Full host-lifecycle proof is incomplete, so customer documentation keeps
      Bob at Preview rather than Compatible.

  - id: kiro
    kind: ide
    in_repo: []
    user_home:
      - path: .kiro/settings/mcp.json
        purpose: Kiro MCP config (project-level)
        installer_writes: false
      - path: ~/.kiro/settings/mcp.json
        purpose: Kiro MCP config (global)
        installer_writes: true
    skill_paths:
      project:
        - .kiro/skills/{name}/SKILL.md
      global:
        - ~/.kiro/skills/{name}/SKILL.md
      format: anthropic-skill-v1
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_cursor_kiro.py
    doc_urls:
      - https://kiro.dev/docs/skills
      - https://kiro.dev/docs/mcp/configuration/
    last_verified: 2026-07-22
    verified_doc_hash: pending
    status: compatible
    notes: |
      The installer emits only the documented global MCP bridge entry. Kiro
      Skills and Steering remain separately planned surfaces.

  - id: kiro-steering
    kind: ide
    in_repo: []
    skill_paths:
      project:
        - .kiro/steering/*.md
      global:
        - ~/.kiro/steering/*.md
      format: kiro-steering
      frontmatter:
        - inclusion
    last_verified: 2026-04-18
    verified_doc_hash: pending
    status: planned
    notes: Kiro Steering is distinct from Kiro Skills (added 2026-Q1).

  - id: cline
    kind: vscode-extension
    skill_paths:
      project:
        - .clinerules/*
        - .clinerules
      global:
        - ~/Documents/Cline/Rules/
      format: plain-md-or-txt
    documentation:
      install_authority: planned
    last_verified: 2026-04-18
    status: planned
    notes: Phase 3 surface (extension-managed; instruction-doc emission rather than file emission).

  - id: roo
    kind: vscode-extension
    skill_paths:
      project:
        - .roo/rules/*
        - .roorules
      global:
        - ~/.roo/rules/
      format: plain-md-or-txt
    documentation:
      install_authority: planned
    last_verified: 2026-04-18
    status: planned
    notes: Phase 3 surface.

  - id: kilo
    kind: vscode-extension
    skill_paths:
      project:
        - .kilocode/rules/*
        - .kilocoderules
      global:
        - ~/.kilocode/rules/
      format: plain-md-or-txt
    documentation:
      install_authority: planned
    last_verified: 2026-04-18
    status: planned
    notes: Phase 3 surface.

  - id: continue
    kind: vscode-extension
    user_home:
      - path: ~/.continue/mcpServers/elefante.yaml
        purpose: Dedicated Elefante MCP server block
        installer_writes: true
    skill_paths:
      project:
        - .continue/rules/*.md
      global:
        - ~/.continue/rules/
      format: continue-rules-md
      frontmatter:
        - name
        - globs
        - alwaysApply
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_additional_hosts.py
    doc_urls:
      - https://docs.continue.dev/customize/deep-dives/mcp
      - https://docs.continue.dev/reference
    last_verified: 2026-08-28
    verified_doc_hash: pending
    status: compatible
    notes: |
      Elefante writes one dedicated MCP block instead of parsing or rewriting
      the user's main Continue YAML. The file is ownership-tracked and removed
      only while its fingerprint still matches the emitted content.

  - id: zed
    kind: ide
    skill_paths:
      project:
        # First-match precedence per Zed convention
        - .rules
        - AGENTS.md
        - CLAUDE.md
        - GEMINI.md
        - .cursorrules
        - .windsurfrules
        - .clinerules
        - .github/copilot-instructions.md
        - AGENT.md
      format: plain-md
    user_home:
      - path: ~/.config/zed/settings.json
        platform: macos-linux
        purpose: Zed context_servers registration
        installer_writes: true
      - path: '%APPDATA%\Zed\settings.json'
        platform: windows
        purpose: Zed context_servers registration
        installer_writes: true
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_additional_hosts.py
    doc_urls:
      - https://zed.dev/docs/ai/mcp
      - https://zed.dev/faq
    last_verified: 2026-08-28
    verified_doc_hash: pending
    status: compatible
    notes: |
      The installer preserves unrelated settings and writes only
      context_servers.elefante after Zed is detected. The exact JSON entry is
      ownership-tracked for safe upgrade and uninstall. Zed's instruction-file
      precedence remains independent from its MCP registration.

  - id: gemini
    kind: cli-agent
    skill_paths:
      project:
        - GEMINI.md
      global:
        - ~/.gemini/GEMINI.md
      format: plain-md
    user_home:
      - path: ~/.gemini/settings.json
        purpose: Gemini MCP servers (mcpServers key)
        installer_writes: true
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_cursor_kiro.py
    doc_urls:
      - https://github.com/google-gemini/gemini-cli/blob/main/docs/tools/mcp-server.md
    last_verified: 2026-07-22
    verified_doc_hash: pending
    status: compatible
    notes: |
      Gemini CLI receives an exact mcpServers.elefante stdio-bridge entry only
      when the CLI and ~/.gemini already exist. The installer preserves every
      other server and records exact-entry ownership for safe uninstall.

  - id: antigravity
    kind: ide
    user_home:
      - path: ~/.gemini/antigravity/mcp_config.json
        purpose: Antigravity MCP server registration
        installer_writes: true
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_antigravity.py
    last_verified: 2026-08-05
    verified_doc_hash: pending
    status: partial
    notes: |
      The installer detects the existing Antigravity directory and writes an
      ownership-tracked MCP entry. Full external host-lifecycle certification
      is incomplete, so this remains Preview.

  - id: codex
    kind: cli-agent
    skill_paths:
      project:
        - AGENTS.md
        - (nested AGENTS.md files supported)
      format: plain-md
    user_home:
      - path: ~/.codex/config.toml
        purpose: Codex CLI MCP config
        installer_writes: true
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_cli_agents.py
    doc_urls:
      - https://learn.chatgpt.com/docs/extend/mcp
    last_verified: 2026-07-22
    status: compatible
    notes: |
      The native Codex CLI writes and removes the user-scoped MCP registration;
      Elefante records a fingerprint of `codex mcp get elefante` before it may
      unregister it. Codex also auto-detects AGENTS.md at repo root and nested paths.

  - id: aider
    kind: cli-agent
    skill_paths:
      project:
        - CONVENTIONS.md
      format: plain-md-explicit-load
    user_home:
      - path: .aider.conf.yml
        purpose: Aider config
        installer_writes: false
    documentation:
      install_authority: planned
    last_verified: 2026-04-18
    status: planned
    notes: |
      Aider requires explicit /read of CONVENTIONS.md; not auto-loaded.
      Phase 3 surface.

  # ───────── Community MCP hosts ─────────

  - id: openclaw
    kind: agent-runtime
    user_home:
      - path: ~/.openclaw/openclaw.json
        purpose: OpenClaw-managed outbound MCP server registry
        installer_writes: true
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_cli_agents.py
    doc_urls:
      - https://docs.openclaw.ai/cli/mcp
    last_verified: 2026-07-22
    status: compatible
    notes: |
      OpenClaw is an MCP client registry and can launch Elefante's local stdio
      bridge. Its native CLI preserves the host-owned registry and Elefante
      fingerprints only the exact registration it creates. It is compatible,
      not certified, until an external host lifecycle run is available.

  - id: agent-zero
    kind: container-capable-agent-runtime
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: manual-only
    doc_urls:
      - https://www.agent-zero.ai/p/docs/mcp-a2a/
    last_verified: 2026-07-22
    status: community
    notes: |
      Agent Zero accepts standard MCP JSON through its MCP/A2A settings UI.
      Its common Docker deployment changes the network and filesystem trust
      boundary, so Elefante intentionally does not write a host configuration
      until a container-safe lifecycle adapter is verified.
