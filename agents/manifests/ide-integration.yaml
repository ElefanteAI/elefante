# Elefante — IDE / Agent Integration Matrix
#
# Single source of truth for every IDE / agent runtime that Elefante integrates with.
# Used by:
#   - agents/installer.md (which surfaces to detect-then-emit)
#   - agents/integration-inspector.md (continuous doc-drift audit)
#   - docs/how-to/configure-ide.md (per-surface install reference)
#   - tests/test_developer_routing.py (drift guards)
#
# Schema source: workspace/proposals/ide-integration-surface.md §7.2
# Status field semantics:
#   configured    — file present and active in this repo (or installer writes it at install time)
#   planned       — surface exists per matrix but Elefante has not yet implemented integration
#   deprecated    — was supported, now retired (kept for migration window)
#
# Last full re-verification: 2026-04-18 (snapshot from spec-ide-integration-surface.md §3).
# Active integration-inspector run before v2.11.0 cut will refresh verified_doc_hash for every row.

schema_version: 1

surfaces:
  # ───────── Currently configured in this repo ─────────

  - id: vscode-copilot
    kind: ide-extension
    in_repo:
      - path: .github/copilot-instructions.md
        purpose: End-user agent constitution (Four Laws, cardinal sins, tool table, commands)
        status: configured
        installer_writes: false
      - path: .github/workflows/build-binaries.yml
        purpose: CI workflow for binary releases
        status: configured
        installer_writes: false
    user_home:
      - path: ~/Library/Application Support/Code/User/mcp.json
        platform: macos
        purpose: VS Code MCP server registration
        installer_writes: true
      - path: '%APPDATA%\Code\User\mcp.json'
        platform: windows
        purpose: VS Code MCP server registration
        installer_writes: true
      - path: ~/.config/Code/User/mcp.json
        platform: linux
        purpose: VS Code MCP server registration
        installer_writes: true
    skill_paths:
      project:
        - .github/skills/
        - .claude/skills/
        - .agents/skills/
      global:
        - ~/.copilot/skills/
        - ~/.claude/skills/
        - ~/.agents/skills/
      format: anthropic-skill-v1
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_vscode_bob.py
    doc_urls:
      - https://docs.github.com/en/copilot/customizing-copilot/about-customizing-github-copilot-chat-responses
      - https://code.visualstudio.com/docs/copilot/copilot-chat
    last_verified: 2026-04-18
    verified_doc_hash: pending  # Refreshed by integration-inspector before v2.11.0 cut

  - id: claude-code
    kind: cli-agent
    in_repo:
      - path: .claude/settings.local.json
        purpose: Claude Code permission whitelist (WebFetch domains for documentation lookups)
        status: configured
        installer_writes: false
      - path: .claude/skills/
        purpose: Anthropic Skill v1 SKILL.md files
        status: planned
        installer_writes: planned-v2.11
    user_home:
      - path: ~/.claude/mcp.json
        purpose: Claude Code MCP server registration
        installer_writes: planned-v2.11
    skill_paths:
      project:
        - .claude/skills/{name}/SKILL.md
      global:
        - ~/.claude/skills/{name}/SKILL.md
      format: anthropic-skill-v1
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: planned-v2.11
    doc_urls:
      - https://code.claude.com/docs/skills
    last_verified: 2026-04-18
    verified_doc_hash: pending
    notes: |
      .claude/settings.local.json is currently the only configured surface for Claude Code.
      Permission whitelist allows WebFetch to: bob.ibm.com, openclaw.ai, clawhub.ai,
      kiro.dev, code.visualstudio.com, docs.openclaw.ai, docs.cursor.com.
      Full Skill v1 surface (.claude/skills/) lands in v2.11.0 per
      workspace/proposals/ide-integration-surface.md §15.2.

  # ───────── Local (gitignored) installer-emitted files ─────────

  - id: cursor
    kind: ide
    in_repo:
      - path: .cursorrules
        purpose: Cursor auto-load instructions (legacy format)
        status: configured-locally-but-gitignored
        installer_writes: true
        notes: |
          Created by scripts/setup/install.py during installation.
          Listed in .gitignore — visible at install time but not in repo.
          Cursor has deprecated this format in favor of .cursor/rules/*.mdc;
          v2.11.0 plan migrates to the new format.
      - path: .cursor/rules/*.mdc
        purpose: Cursor rules (new format)
        status: planned
        installer_writes: planned-v2.11
    user_home:
      - path: ~/.cursor/mcp.json
        purpose: Cursor MCP server registration
        installer_writes: true
    skill_paths:
      project:
        - .cursor/rules/*.mdc
      global:
        - (UI-only; user rules entered via Cursor settings)
      format: cursor-rules-mdc
      frontmatter:
        - description
        - globs
        - alwaysApply
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_vscode_bob.py
    doc_urls:
      - https://docs.cursor.com/context/rules
    last_verified: 2026-04-18
    verified_doc_hash: pending

  - id: windsurf
    kind: ide
    in_repo:
      - path: .windsurfrules
        purpose: Windsurf auto-load instructions
        status: configured-locally-but-gitignored
        installer_writes: true
        notes: Listed in .gitignore.
      - path: .windsurf/rules/*.md
        purpose: Windsurf rules (frontmatter format)
        status: planned
        installer_writes: planned-v2.11
    user_home:
      - path: ~/.codeium/windsurf/memories/global_rules.md
        purpose: Global Windsurf memories
        installer_writes: planned-v2.11
    skill_paths:
      project:
        - .windsurf/rules/*.md
      global:
        - ~/.codeium/windsurf/memories/global_rules.md
      format: windsurf-rules-frontmatter
      frontmatter:
        - trigger
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: planned-v2.11
    last_verified: 2026-04-18
    verified_doc_hash: pending

  # ───────── Planned (v2.11 detect-then-emit installer) ─────────

  - id: bob
    kind: ide
    in_repo: []
    user_home:
      - path: ~/.bob/settings/mcp_settings.json
        purpose: IBM Bob MCP server registration (canonical path)
        installer_writes: planned-v2.11
    skill_paths:
      project:
        - .bob/skills/{name}/SKILL.md
      global:
        - ~/.bob/skills/{name}/SKILL.md
      format: anthropic-skill-v1
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_vscode_bob.py  # also handles Bob detection
    last_verified: 2026-04-18
    verified_doc_hash: pending
    status: planned-v2.11
    notes: |
      Bob uses a non-standard config path (~/.bob/settings/mcp_settings.json) per
      ops-installation-compendium.md Issue #7. The current installer script
      (configure_vscode_bob.py) was extended after that bug; v2.11 daemon-mode
      adapter consolidates the path knowledge into this matrix.

  - id: kiro-skills
    kind: ide
    in_repo: []
    user_home:
      - path: .kiro/settings/mcp.json
        purpose: Kiro MCP config (project-level)
        installer_writes: planned-v2.11
      - path: ~/.kiro/settings/mcp.json
        purpose: Kiro MCP config (global)
        installer_writes: planned-v2.11
    skill_paths:
      project:
        - .kiro/skills/{name}/SKILL.md
      global:
        - ~/.kiro/skills/{name}/SKILL.md
      format: anthropic-skill-v1
    documentation:
      install_authority: planned-v2.11
    doc_urls:
      - https://kiro.dev/docs/skills
    last_verified: 2026-04-18
    verified_doc_hash: pending
    status: planned-v2.11

  - id: kiro-steering
    kind: ide
    in_repo: []
    skill_paths:
      project:
        - .kiro/steering/*.md
      global:
        - ~/.kiro/steering/*.md
      format: kiro-steering
      frontmatter:
        - inclusion
    last_verified: 2026-04-18
    verified_doc_hash: pending
    status: planned-v2.11
    notes: Kiro Steering is distinct from Kiro Skills (added 2026-Q1).

  - id: cline
    kind: vscode-extension
    skill_paths:
      project:
        - .clinerules/*
        - .clinerules
      global:
        - ~/Documents/Cline/Rules/
      format: plain-md-or-txt
    documentation:
      install_authority: planned-v2.12
    last_verified: 2026-04-18
    status: planned-v2.12
    notes: Phase 3 surface (extension-managed; instruction-doc emission rather than file emission).

  - id: roo
    kind: vscode-extension
    skill_paths:
      project:
        - .roo/rules/*
        - .roorules
      global:
        - ~/.roo/rules/
      format: plain-md-or-txt
    documentation:
      install_authority: planned-v2.12
    last_verified: 2026-04-18
    status: planned-v2.12
    notes: Phase 3 surface.

  - id: kilo
    kind: vscode-extension
    skill_paths:
      project:
        - .kilocode/rules/*
        - .kilocoderules
      global:
        - ~/.kilocode/rules/
      format: plain-md-or-txt
    documentation:
      install_authority: planned-v2.12
    last_verified: 2026-04-18
    status: planned-v2.12
    notes: Phase 3 surface.

  - id: continue
    kind: vscode-extension
    skill_paths:
      project:
        - .continue/rules/*.md
      global:
        - ~/.continue/rules/
      format: continue-rules-md
      frontmatter:
        - name
        - globs
        - alwaysApply
    documentation:
      install_authority: planned-v2.12
    last_verified: 2026-04-18
    status: planned-v2.12

  - id: zed
    kind: ide
    skill_paths:
      project:
        # First-match precedence per Zed convention
        - .rules
        - AGENTS.md
        - CLAUDE.md
        - GEMINI.md
        - .cursorrules
        - .windsurfrules
        - .clinerules
        - .github/copilot-instructions.md
        - AGENT.md
      format: plain-md
    user_home:
      - path: ~/.config/zed/settings.json
        purpose: Zed MCP server registration
        installer_writes: planned-v2.11
    documentation:
      install_authority: planned-v2.11
    last_verified: 2026-04-18
    status: planned-v2.11
    notes: |
      Zed auto-detects from a precedence list. The universal AGENTS.md (this repo's
      new root-level file as of 2026-05-02) is the second item in the list; the
      first (.rules) is not yet authored. Reading order matters.

  - id: gemini
    kind: cli-and-ide
    skill_paths:
      project:
        - GEMINI.md
      global:
        - ~/.gemini/GEMINI.md
      format: plain-md
    user_home:
      - path: ~/.gemini/settings.json
        purpose: Gemini MCP servers (mcpServers key)
        installer_writes: configure_antigravity.py
      - path: ~/.gemini/antigravity/mcp_config.json
        purpose: Antigravity-specific MCP config
        installer_writes: scripts/setup/configure_antigravity.py
    documentation:
      reference: docs/how-to/configure-ide.md
      install_authority: scripts/setup/configure_antigravity.py
    last_verified: 2026-04-18
    verified_doc_hash: pending
    status: partial-via-antigravity
    notes: |
      Antigravity (Gemini-family) is partially supported via configure_antigravity.py.
      Generic Gemini Code Assist / Gemini CLI integration via GEMINI.md root file
      is planned for v2.11.

  - id: codex
    kind: cli-agent
    skill_paths:
      project:
        - AGENTS.md
        - (nested AGENTS.md files supported)
      format: plain-md
    user_home:
      - path: ~/.codex/config.toml
        purpose: Codex CLI MCP config
        installer_writes: planned-v2.11
    documentation:
      install_authority: planned-v2.11
    last_verified: 2026-04-18
    status: planned-v2.11
    notes: |
      Codex auto-detects AGENTS.md at repo root and any nested AGENTS.md.
      The AGENTS.md authored on 2026-05-02 makes this surface immediately
      partially functional even before v2.11 daemon work.

  - id: aider
    kind: cli-agent
    skill_paths:
      project:
        - CONVENTIONS.md
      format: plain-md-explicit-load
    user_home:
      - path: .aider.conf.yml
        purpose: Aider config
        installer_writes: planned-v2.12
    documentation:
      install_authority: planned-v2.12
    last_verified: 2026-04-18
    status: planned-v2.12
    notes: |
      Aider requires explicit /read of CONVENTIONS.md; not auto-loaded.
      Phase 3 surface.

  # ───────── Out of scope (confirmed) ─────────

  - id: openclaw
    kind: chat-gateway-not-coding-agent
    status: out-of-scope
    notes: |
      OpenClaw is a chat gateway, not a coding-agent surface. Confirmed as
      out-of-scope per workspace/proposals/ide-integration-surface.md §3.

# ───────── Convergence points (per spec §3) ─────────
#
# Three convergences make Phase 2 (v2.11) feasible at manageable cost:
#
#   1. SKILL.md (Anthropic Skill v1) is the emerging open standard:
#      Claude Code, VS Code Copilot, IBM Bob, Kiro all read the same format.
#      One authored skill serves four surfaces.
#
#   2. .claude/skills/ is a native shared namespace for Claude Code +
#      VS Code Copilot. Documented, not a hack.
#
#   3. AGENTS.md at project root is auto-detected by Codex, Cursor (nested),
#      VS Code Copilot, Cline, Roo, Kilo, and Zed. Seven surfaces covered
#      by one root file.
#
# Without these convergences, the matrix would require ~16 separate adapters.
# With them, Phase 2 collapses to ~6 write actions per detected surface set.
